<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus ETA Report</title>
    <script src="jquery.min.js"></script>
    <script src="update.js"></script>
    <link rel="stylesheet" href="style.css"> <!-- Link external CSS -->
</head>

<body>
    <div class="header" , style="align-items: left;", overflow="hidden">
        <img class="logo" src="logo-full-v2.0.png" alt="Logo">
        <div class="title">ETA&nbsp;&nbsp;&nbsp;</div> 
		<img src="Header.png">
        <div class="title">&nbsp;&nbsp;&nbsp;</div> 
        <div style="display: flex; flex-direction: column; align-items: center;">
            <span id="time">Starting</span>
            <span id="timeSynced">Last synced: syncing</span>
        </div>
    </div>
    <table>
        <tr>
            <td class="top-left" colspan="3">South Gate</td>
            <td class="top-right" colspan="3">North Gate</td>
        </tr>
        <tr>
            <td class="tdnum"><span id="N0"></span></td>
            <td class="tddat"><span id="D00"></span></td>
            <td class="tddat"><span id="D01"></span></td>
            <td class="tdnum"><span id="N3"></span></td>
            <td class="tddat"><span id="D30"></span></td>
            <td class="tddat"><span id="D31"></span></td>
        </tr>
        <tr>
            <td class="tdnum"><span id="N1"></span></td>
            <td class="tddat"><span id="D10"></span></td>
            <td class="tddat"><span id="D11"></span></td>
            <td class="tdnum"><span id="N4"></span></td>
            <td class="tddat"><span id="D40"></span></td>
            <td class="tddat"><span id="D41"></span></td>
        </tr>
        <tr>
            <td class="tdnumBL"><span id="N2"></span></td>
            <td class="tddat"><span id="D20"></span></td>
            <td class="tddat"><span id="D21"></span></td>
            <td class="tdnum"><span id="N5"></span></td>
            <td class="tddat"><span id="D50"></span></td>
            <td class="tddatBR"><span id="D51"></span></td>
        </tr>
    </table>
</body>

</html>
